<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CraveFit | Fitness & Nutrition Dashboard</title>
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 1rem; min-height: 100vh; }
        .container { max-width: 600px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 2rem; padding-top: 1rem; }
        h1 { color: var(--primary); font-size: 2rem; margin-bottom: 0.5rem; }
        p { color: var(--text-muted); font-size: 0.95rem; }
        .card { background-color: var(--card-bg); border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }
        h2 { font-size: 1.25rem; margin-bottom: 1rem; color: var(--text); border-bottom: 2px solid var(--primary); padding-bottom: 0.5rem; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.3rem; }
        input, select { width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: var(--text); font-size: 1rem; }
        button { background-color: var(--primary); color: white; border: none; width: 100%; padding: 0.85rem; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background-color: var(--primary-dark); }
        .results { margin-top: 1rem; padding: 1rem; background: #0f172a; border-radius: 8px; display: none; }
        .result-item { display: flex; justify-content: space-between; margin-bottom: 0.5rem; font-size: 0.95rem; }
        .result-value { font-weight: bold; color: var(--primary); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>CraveFit</h1>
            <p>Your Personal Nutrition & Fitness Control Center</p>
        </header>

        <!-- Calorie & Macro Calculator Card -->
        <div class="card">
            <h2>Daily Macro & Calorie Calculator</h2>
            <div class="form-group">
                <label for="weight">Weight (kg)</label>
                <input type="number" id="weight" placeholder="e.g., 75">
            </div>
            <div class="form-group">
                <label for="height">Height (cm)</label>
                <input type="number" id="height" placeholder="e.g., 175">
            </div>
            <div class="form-group">
                <label for="age">Age (years)</label>
                <input type="number" id="age" placeholder="e.g., 28">
            </div>
            <div class="form-group">
                <label for="activity">Activity Level</label>
                <select id="activity">
                    <option value="1.2">Sedentary (Little or no exercise)</option>
                    <option value="1.375">Lightly Active (1-3 days/week)</option>
                    <option value="1.55" selected>Moderately Active (3-5 days/week)</option>
                    <option value="1.725">Very Active (6-7 hard days/week)</option>
                </select>
            </div>
            <button onclick="calculateMacros()">Calculate Targets</button>

            <div id="results" class="results">
                <div class="result-item"><span>Maintenance Calories:</span> <span id="calories" class="result-value">-</span></div>
                <div class="result-item"><span>Protein Target:</span> <span id="protein" class="result-value">-</span></div>
                <div class="result-item"><span>Carb Target:</span> <span id="carbs" class="result-value">-</span></div>
                <div class="result-item"><span>Fat Target:</span> <span id="fats" class="result-value">-</span></div>
            </div>
        </div>
    </div>

    <script>
        function calculateMacros() {
            const weight = parseFloat(document.getElementById('weight').value);
            const height = parseFloat(document.getElementById('height').value);
            const age = parseInt(document.getElementById('age').value);
            const activity = parseFloat(document.getElementById('activity').value);

            if (!weight || !height || !age) {
                alert('Please fill in all weight, height, and age fields.');
                return;
            }

            // Mifflin-St Jeor Equation for BMR (Male baseline default)
            const bmr = (10 * weight) + (6.25 * height) - (5 * age) + 5;
            const tdee = Math.round(bmr * activity);

            // Simple macro split estimation
            const protein = Math.round(weight * 2.2); // ~2.2g per kg
            const fats = Math.round((tdee * 0.25) / 9); // 25% calories from fat
            const carbs = Math.round((tdee - (protein * 4) - (fats * 9)) / 4);

            document.getElementById('calories').innerText = tdee + ' kcal';
            document.getElementById('protein').innerText = protein + 'g';
            document.getElementById('carbs').innerText = carbs + 'g';
            document.getElementById('fats').innerText = fats + 'g';

            document.getElementById('results').style.display = 'block';
        }
    </script>
</body>
</html>
